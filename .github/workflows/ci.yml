name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Catalog smoke check
        run: python -m scenarios.catalog
      - name: Catalog JSON smoke check
        run: python -m scenarios.catalog --format json
      - name: Runner smoke check
        run: python -c "from scenarios.runner import run_scenario, report_to_json; print(report_to_json(run_scenario('retry', seed=0)))"
      - name: CLI list smoke check
        run: python -m scenarios.cli list
      - name: CLI list JSON smoke check
        run: python -m scenarios.cli list --format json
      - name: CLI show smoke check
        run: python -m scenarios.cli show retry
      - name: CLI run smoke check
        run: python -m scenarios.cli run retry --seed 0
      - name: CLI run-all smoke check
        run: python -m scenarios.cli run-all --seed 0

